[workspace]
resolver = "3"
members = ["crates/stollen-core", "crates/stollen-ssh", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/musiker15/stollen"

[workspace.dependencies]
stollen-core = { path = "crates/stollen-core" }
stollen-ssh = { path = "crates/stollen-ssh" }
russh = "0.65.1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
keyring = "4.2.0"
chacha20poly1305 = "0.11.0"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
zeroize = { version = "1.9.1", features = ["serde"] }
rand = "0.10.3"
directories = "6.0.0"
async-trait = "0.1.92"
futures = "0.3.34"
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
