[workspace]
resolver = "3"
members = ["crates/sshcraft-core", "crates/sshcraft-ssh", "crates/sshcraft-proto", "crates/sshcraft-server", "crates/sshcraft-sync", "crates/sshcraft-local", "crates/sshcraft-fido", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/musiker15/sshcraft"

[workspace.dependencies]
csv = "1.4.0"
sshcraft-core = { path = "crates/sshcraft-core" }
sshcraft-ssh = { path = "crates/sshcraft-ssh" }
russh = "0.65.1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
keyring = "4.2.0"
chacha20poly1305 = "0.11.0"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
zeroize = { version = "1.9.1", features = ["serde"] }
rand = "0.10.3"
directories = "6.0.0"
async-trait = "0.1.92"
futures = "0.3.34"
ed25519-dalek = "3.0.0"
hpke = { version = "0.15.1", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
sha2 = "0.11.1"
data-encoding = "2.11.1"
tempfile = "3.27.0"
sshcraft-proto = { path = "crates/sshcraft-proto" }
sshcraft-sync = { path = "crates/sshcraft-sync" }
sshcraft-local = { path = "crates/sshcraft-local" }
sshcraft-fido = { path = "crates/sshcraft-fido" }
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
subtle = "2.6.1"
hmac = "0.13.0"
hkdf = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "http2"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
sshcraft-server = { path = "crates/sshcraft-server" }
tokio-postgres = { version = "0.7.18", features = ["with-uuid-1"] }
deadpool-postgres = "0.14.2"
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"
tokio-tungstenite = "0.30.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Signature checks dominate the server tests; optimizing these crates keeps debug test runs fast.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
