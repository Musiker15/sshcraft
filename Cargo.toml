[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/musiker15/sshcraft"

[workspace.dependencies]
# internal
sshcraft-platform = { path = "crates/platform" }
sshcraft-model = { path = "crates/model" }
sshcraft-store = { path = "crates/store" }
sshcraft-import = { path = "crates/import" }
sshcraft-proto = { path = "crates/proto" }
sshcraft-ssh = { path = "crates/ssh" }
sshcraft-local = { path = "crates/local" }
sshcraft-telnet = { path = "crates/telnet" }
sshcraft-sync = { path = "crates/sync" }
sshcraft-fido = { path = "crates/fido" }
sshcraft-server-lib = { path = "crates/server" }
sshcraft-engine = { path = "crates/engine" }
sshcraft-term = { path = "crates/term" }
sshcraft-ui-egui = { path = "crates/ui-egui" }
sshcraft-link = { path = "crates/link" }
sshcraft-mcp = { path = "crates/mcp" }

# foundation
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.2", features = ["v4", "serde"] }
tokio = { version = "1.54.1", features = ["full"] }
async-trait = "0.1.92"
strum = { version = "0.28.0", features = ["derive"] }
futures = "0.3.34"
directories = "6.0.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
csv = "1.4.0"
data-encoding = "2.11.1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
wait-timeout = "0.2.1"
sys-locale = "0.3.2"
url = "2.5.8"
winreg = "0.56.0"
base64 = "0.23.1"
notify-rust = "4.19.0"
regex = "1.13.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
bitflags = "2.13.2"
unicode-width = "0.2.3"
cursor-icon = "1.2.0"
raw-window-handle = "0.6.2"

# terminal
alacritty_terminal = { version = "0.26.0", default-features = false }

# interface: egui from the fork of the Craft family (see [patch.crates-io] below)
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
egui_kittest = "0.37"
egui_system_font_provider = "0.37"
# The version egui_system_font_provider of the fork uses, so the font stack is not built twice.
fontique = { version = "0.11.1", default-features = false, features = ["system"] }
image = { version = "0.25.10", default-features = false }

# ssh and storage
russh = "0.65.1"
russh-sftp = "3.0.1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
keyring = "4.2.0"
keyring-core = "1.0.1"
webpki-root-certs = "1.0.12"
android-native-keyring-store = "1.0.0"

# cryptography
chacha20poly1305 = "0.11.0"
argon2 = "0.6.0"
sha1 = "0.11.0"
zeroize = { version = "1.9.1", features = ["serde"] }
rand = "0.10.3"
ed25519-dalek = "3.0.0"
hpke = { version = "0.15.1", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
sha2 = "0.11.1"
subtle = "2.6.1"
hmac = "0.13.0"
hkdf = "0.13.0"

# network and server
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "http2"] }
axum = { version = "0.8.9", features = ["ws"] }
tokio-postgres = { version = "0.7.18", features = ["with-uuid-1"] }
deadpool-postgres = "0.14.2"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"

# craft-libs: the shared libraries of the Craft apps, all from one pinned revision.
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "cebc847ba814208016be3709ae1cf6cdac76e032", version = "0.1.0" }
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "cebc847ba814208016be3709ae1cf6cdac76e032" }
craft-keymap = { git = "https://github.com/storytold/craft-libs", rev = "cebc847ba814208016be3709ae1cf6cdac76e032", features = ["egui"] }
craft-dialogs = { git = "https://github.com/storytold/craft-libs", rev = "cebc847ba814208016be3709ae1cf6cdac76e032" }
craft-flags = { git = "https://github.com/storytold/craft-libs", rev = "cebc847ba814208016be3709ae1cf6cdac76e032" }
craft-window = { git = "https://github.com/storytold/craft-libs", rev = "cebc847ba814208016be3709ae1cf6cdac76e032", features = ["egui"] }
craft-menu = { git = "https://github.com/storytold/craft-libs", rev = "cebc847ba814208016be3709ae1cf6cdac76e032" }
craft-quit = { git = "https://github.com/storytold/craft-libs", rev = "cebc847ba814208016be3709ae1cf6cdac76e032", features = ["egui"] }
craft-fonts-build = { git = "https://github.com/storytold/craft-libs", rev = "cebc847ba814208016be3709ae1cf6cdac76e032" }
# craft-ai-integrations: the launcher's list of apps agents may use, pinned to one revision.
craft-ai-agents = { git = "https://github.com/storytold/craft-ai-integrations", rev = "db30646d9df2ae5d36d74f3feed6dc6f00d3ef6b" }

# tests
tempfile = "3.27.0"
memory-stats = "1.2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Signature checks dominate the server tests; optimizing these crates keeps debug test runs fast.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# Argon2id with 64 MiB takes seconds unoptimized; backups and portable mode's key file use it.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# The egui fork of the Craft family, at the revision craft-libs pins (craft-libs Cargo.toml).
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_system_font_provider = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
