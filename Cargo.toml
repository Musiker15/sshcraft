[workspace]
resolver = "3"
members = ["crates/sshcraft-core", "crates/sshcraft-ssh", "crates/sshcraft-proto", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/musiker15/sshcraft"

[workspace.dependencies]
sshcraft-core = { path = "crates/sshcraft-core" }
sshcraft-ssh = { path = "crates/sshcraft-ssh" }
russh = "0.65.1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
keyring = "4.2.0"
chacha20poly1305 = "0.11.0"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
zeroize = { version = "1.9.1", features = ["serde"] }
rand = "0.10.3"
directories = "6.0.0"
async-trait = "0.1.92"
futures = "0.3.34"
ed25519-dalek = "3.0.0"
hpke = { version = "0.15.1", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
sha2 = "0.11.1"
data-encoding = "2.11.1"
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
