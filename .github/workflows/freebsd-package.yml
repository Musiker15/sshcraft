name: FreeBSD package

# Builds packaging/freebsd/package.sh in a FreeBSD VM, for the release (release.yml) and for the
# pull-request check (freebsd.yml), which also runs the tests there first. GitHub has no FreeBSD runner, so an x86_64 FreeBSD guest runs
# on an Ubuntu host; aarch64 is cross-compiled in that same guest (an emulated aarch64 guest
# would take hours), with the toolchain from .github/scripts/freebsd-aarch64-cross.sh.
on:
  workflow_call:
    inputs:
      architectures:
        description: 'JSON array out of "x86_64" and "aarch64"'
        type: string
        default: '["x86_64","aarch64"]'
      version:
        description: "Version to build (empty: Cargo.toml)"
        type: string
        default: ""
      override:
        description: "Write the version to Cargo.toml first (a test run's override)"
        type: boolean
        default: false
      date:
        description: "Build date, YYYY-MM-DD (empty: today)"
        type: string
        default: ""
      test:
        description: "Run cargo test on x86_64 before packaging (an aarch64 binary cannot run in the guest)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  freebsd:
    name: FreeBSD ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architectures) }}
    env:
      ARCH: ${{ matrix.arch }}
      SSHCRAFT_VERSION: ${{ inputs.version }}
      SSHCRAFT_BUILD_DATE: ${{ inputs.date }}
      SSHCRAFT_BUILD_SHA: ${{ github.sha }}
      SET_VERSION: ${{ inputs.override && '1' || '' }}
      RUN_TESTS: ${{ inputs.test && matrix.arch == 'x86_64' && '1' || '' }}
      # Outside the synced workspace, so the VM's rsync back carries no build output.
      CARGO_HOME: /var/tmp/sshcraft-cargo
      CARGO_TARGET_DIR: /var/tmp/sshcraft-target
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 4
      CARGO_TERM_COLOR: always
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      # The architecture and the version end up in the guest's shell, so both are checked here.
      - name: Check the inputs
        run: |
          case "$ARCH" in
            x86_64 | aarch64) ;;
            *) echo "::error::FreeBSD architecture must be x86_64 or aarch64, not '$ARCH'"; exit 1 ;;
          esac
          if [ -n "$SSHCRAFT_VERSION" ] && ! [[ "$SSHCRAFT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::bad version '$SSHCRAFT_VERSION'"; exit 1
          fi
          if [ -n "$SSHCRAFT_BUILD_DATE" ] && ! [[ "$SSHCRAFT_BUILD_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::bad date '$SSHCRAFT_BUILD_DATE'"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out craft-fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts
          persist-credentials: false
      # The VM disk lives on the host's disk; the image's unused toolchains make room for it.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Start the FreeBSD VM
        uses: step-security/freebsd-vm@a2f5754275f7b0d5cea7f2762c9960727950f128 # v1.5.9
        with:
          release: "15.1"
          usesh: true
          cpu: 4
          mem: 12288
          copyback: false
          envs: "ARCH SSHCRAFT_VERSION SSHCRAFT_BUILD_DATE SSHCRAFT_BUILD_SHA SET_VERSION RUN_TESTS CARGO_HOME CARGO_TARGET_DIR CARGO_INCREMENTAL CARGO_BUILD_JOBS"
          # x86_64 builds with rustup's stable Rust. aarch64 needs FreeBSD's lang/rust for both
          # architectures at one version; the quarterly branch builds them in step, "latest" may
          # not.
          prepare: |
            unset CARGO_HOME CARGO_TARGET_DIR
            if [ "$ARCH" = aarch64 ]; then
              mkdir -p /usr/local/etc/pkg/repos
              printf 'FreeBSD-ports: { url: "https://pkg.FreeBSD.org/${ABI}/quarterly" }\n' >/usr/local/etc/pkg/repos/FreeBSD.conf
              pkg update -f -q
            fi
            # dejavu: the tests ask fontconfig for fonts, and fontique panics when it finds none.
            pkg install -y bash git curl pkgconf cmake-core libxkbcommon wayland libX11 libXcursor libXrandr libXi libxcb mesa-libs vulkan-loader fontconfig freetype2 dejavu
            if [ "$ARCH" = aarch64 ]; then
              pkg install -y rust
            else
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            fi
      # As an ordinary user: root is never refused a file, so a test that expects "permission
      # denied" would fail, and a permission bug would go unseen.
      - name: Tests
        if: inputs.test && matrix.arch == 'x86_64'
        shell: freebsd {0}
        run: |
          set -eu
          . "$HOME/.cargo/env"
          git config --global --add safe.directory '*'
          id sshcraft-test >/dev/null 2>&1 || pw useradd sshcraft-test -m -s /bin/sh
          mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR"
          chmod 755 /root
          chown -R sshcraft-test "$CARGO_HOME" "$CARGO_TARGET_DIR" "$PWD"
          su -m sshcraft-test -c "HOME=/home/sshcraft-test RUSTUP_HOME=/root/.rustup CRAFT_FONTS_DIR=$PWD/craft-fonts CRAFT_FONTS_REQUIRED=1 cargo test --workspace --locked"
          chown -R root "$CARGO_HOME" "$CARGO_TARGET_DIR" "$PWD"
      - name: aarch64 cross toolchain
        if: matrix.arch == 'aarch64'
        shell: freebsd {0}
        run: sh .github/scripts/freebsd-aarch64-cross.sh
      - name: Build and package
        shell: freebsd {0}
        run: |
          set -eu
          [ ! -f "$HOME/.cargo/env" ] || . "$HOME/.cargo/env"
          git config --global --add safe.directory '*'
          # Empty values would override what packaging/env.sh reads from Cargo.toml and git.
          [ -n "${SSHCRAFT_VERSION:-}" ] || unset SSHCRAFT_VERSION
          [ -n "${SSHCRAFT_BUILD_DATE:-}" ] || unset SSHCRAFT_BUILD_DATE
          # xtask runs on the guest, so before the cross variables.
          if [ -n "${SET_VERSION:-}" ]; then cargo xtask version set "$SSHCRAFT_VERSION"; fi
          if [ "$ARCH" = aarch64 ]; then
            . /var/tmp/sshcraft-cross/env
            # package.sh names the archive after CARGO_BUILD_TARGET; without it an x86_64 build
            # would ship as aarch64.
            [ "${CARGO_BUILD_TARGET:-}" = aarch64-unknown-freebsd ] || { echo "error: cross environment missing" >&2; exit 1; }
          fi
          export CRAFT_FONTS_DIR="$PWD/craft-fonts" CRAFT_FONTS_REQUIRED=1
          bash packaging/freebsd/package.sh
          ls dist/release/*-freebsd-*.tar.gz
          for archive in dist/release/*-freebsd-*.tar.gz; do
            case "$archive" in
              *-freebsd-"$ARCH".tar.gz) tar -tzf "$archive" >/dev/null ;;
              *) echo "error: $archive is not the $ARCH archive" >&2; exit 1 ;;
            esac
          done
      - name: Copy the archive out of the VM
        run: |
          mkdir -p dist/release
          rsync -a --timeout=1800 --rsync-path='env PATH=/usr/local/bin:/usr/bin:/bin rsync' \
            -e 'ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=60 -o ConnectTimeout=120' \
            "freebsd:$GITHUB_WORKSPACE/dist/release/" dist/release/
          ls -l dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-freebsd-${{ matrix.arch }}
          path: dist/release/*-freebsd-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
