name: Android release

# Builds the Android APK (arm64). This job runs on its own because the shared release workflow in
# craft-common-actions has no Android SDK (AGENTS.md, "CI workflows"); it moves there once one
# does. A run by hand builds a test APK signed with a throwaway debug key and keeps it as an
# artifact. A push to the release branch signs it with the release key from the `release`
# environment and attaches it to the draft release of that version.
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-build:
    name: Test APK (debug key)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - name: Android platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" > /dev/null
      - name: Build the APK
        # One APK per processor: arm64 (most devices), armv7 (older 32-bit ones), x86_64
        # (Chromebooks, x86 tablets).
        run: |
          for abi in arm64 armv7 x86_64; do
            cargo xtask android --abi "$abi"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: android-test-apk
          path: dist/android/*.apk
          if-no-files-found: error

  release:
    name: Signed APK for the draft release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - name: Android platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" > /dev/null
      # Every APK of a release must carry the same key, or Android refuses the update. Without the
      # secrets the job stops instead of signing with a debug key.
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD are not set in the release environment (docs/releasing.md)"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          printf '%s' "$PASSWORD" > "$RUNNER_TEMP/release.pass"
          echo "SSHCRAFT_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "SSHCRAFT_ANDROID_KEYSTORE_PASS_FILE=$RUNNER_TEMP/release.pass" >> "$GITHUB_ENV"
      - name: Build the APK
        # One APK per processor: arm64 (most devices), armv7 (older 32-bit ones), x86_64
        # (Chromebooks, x86 tablets).
        run: |
          for abi in arm64 armv7 x86_64; do
            cargo xtask android --abi "$abi"
          done
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/release.pass"
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/android/*.apk
          if-no-files-found: error
      # The shared workflow creates the draft; it may still be building the other platforms, so
      # this waits for it (at most an hour) and then adds the APK. Without a draft (an unsigned
      # release put together by hand) the artifact above is the APK to attach.
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cargo xtask version | tail -n 1)
          for _ in $(seq 60); do
            if gh release view "v$version" > /dev/null 2>&1; then
              gh release upload "v$version" dist/android/*.apk --clobber
              exit 0
            fi
            sleep 60
          done
          echo "::warning::no draft release v$version yet; attach the android-apk artifact by hand"
