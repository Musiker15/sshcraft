name: House rules

on:
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - CLAUDE.md
      - .github/workflows/house-rules.yml
      - .github/scripts/house_rules.py
  pull_request:
    paths:
      - AGENTS.md
      - CLAUDE.md
      - .github/workflows/house-rules.yml
      - .github/scripts/house_rules.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: house-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  house-rules:
    name: house rules match craft-contrib
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The source of the house-rules blocks, with its history: a block names a commit there.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-contrib
          ref: main
          path: .craft-contrib
          fetch-depth: 0
          persist-credentials: false
      - name: The blocks in AGENTS.md are the ones in craft-contrib
        run: python3 .github/scripts/house_rules.py AGENTS.md .craft-contrib --rust
