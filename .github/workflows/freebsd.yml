name: FreeBSD

# Runs the tests on FreeBSD and builds its package when the FreeBSD packaging changes, so a
# broken package.sh shows up in the pull request and not on release day. Pull requests build
# x86_64 only (the aarch64 cross build takes much longer); a run by hand builds both. The release
# builds the packages through the same reusable workflow, freebsd-package.yml.
on:
  pull_request:
    paths:
      - .github/workflows/freebsd.yml
      - .github/workflows/freebsd-package.yml
      - .github/scripts/freebsd-aarch64-cross.sh
      - packaging/freebsd/**
      - packaging/env.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    uses: ./.github/workflows/freebsd-package.yml
    with:
      architectures: ${{ github.event_name == 'pull_request' && '["x86_64"]' || '["x86_64","aarch64"]' }}
      test: true
