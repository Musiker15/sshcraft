name: CI

# Quality gates for every push to main and every pull request (`cargo xtask ci`), through the
# shared gate workflow of the Craft apps in craft-common-actions.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    # Tracks @main so suite-wide CI fixes reach every app without a PR in each repository.
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      # Ubuntu and Windows on every run. macOS (whose minutes count ten times on a private
      # repository) on pushes to main and on pull requests labelled full-ci. FreeBSD has its own
      # workflow.
      os: >-
        ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
        && '["ubuntu-24.04","windows-latest","macos-latest"]' || '["ubuntu-24.04","windows-latest"]' }}
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
        libgtk-3-dev libfontconfig1-dev libfreetype-dev libudev-dev libdbus-1-dev mesa-vulkan-drivers
      # The suite's craft-fonts commit, as in release.yml and freebsd.yml, so the gate tests the
      # fonts that ship.
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      tools: cargo-nextest@0.9.152,cargo-deny@0.20.2
      targets: wasm32-unknown-unknown
