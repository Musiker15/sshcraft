name: CI

# The gate of every pull request and of main: `cargo xtask ci` (fmt, clippy, tests, layers, assets,
# deny, wasm) on Linux and Windows, and on macOS too for main and for a pull request labelled
# `full-ci`. A second job runs clippy for Android, which the desktop gate cannot.
#
# SSHCraft keeps its own workflows instead of the shared ones of storytold/craft-common-actions
# (docs/decisions.md, 2026-11-18), so they can be changed here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A workflow of its own so the required checks keep their names: gate / gate (<os>).
  gate:
    uses: ./.github/workflows/gate.yml
    with:
      os: >-
        ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
        && '["ubuntu-24.04","windows-latest","macos-latest"]' || '["ubuntu-24.04","windows-latest"]' }}

  android:
    name: android (clippy)
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update \
            --component clippy --target aarch64-linux-android
          rustup default stable
      - name: Android platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" > /dev/null
      - uses: step-security/rust-cache@8871c8ba063416da7c32246932ea6ae08700453e # v2.9.2
        with:
          shared-key: android
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy for Android
        run: cargo xtask android --check
