# Adapted from storytold/gridcraft (Apache-2.0).
# .deb and .rpm packages (nfpm: https://nfpm.goreleaser.com). Run by package.sh, which stages
# the file tree, substitutes its path for ${STAGE} (nfpm doesn't expand env vars in `src`) and
# exports VERSION and NFPM_ARCH.
#
#   nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/release/
name: sshcraft
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
# semver: 0.2.0-rc.1 becomes 0.2.0~rc.1 in deb/rpm, so pre-releases sort before the release.
version_schema: semver
release: 1
section: misc
priority: optional
maintainer: ${SSHCRAFT_MAINTAINER}
vendor: MSK Scripts
homepage: https://github.com/musiker15/sshcraft
license: MIT OR Apache-2.0
description: |-
  Open-source SSH client with end-to-end encrypted, self-hosted sync.
  Hosts, keys, snippets, tabs and panes, port forwarding, session logs,
  serial ports and the local shell.
  Includes sshcraft-cli, the command line and MCP server for AI agents.

# The binaries link only glibc and libgcc_s directly. Windowing (X11/Wayland, xkbcommon) and the
# GPU (Vulkan, EGL/GL) are loaded at runtime, so they are dependencies/recommendations here
# rather than ELF NEEDED entries.
overrides:
  deb:
    depends:
      # package.sh puts in the newest glibc version the binaries need.
      - libc6 (>= ${GLIBC_FLOOR})
      - libgcc-s1
      - libxkbcommon0
      # winit loads it for an X11 session; without it the window panics at start.
      - libxkbcommon-x11-0
      - libvulkan1 | libegl1
      # The keyring (Secret Service over D-Bus), the file dialogs (GTK) and the fonts.
      - libdbus-1-3
      - libgtk-3-0
      - libfontconfig1
      - libudev1
    recommends:
      - libwayland-client0
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - mesa-vulkan-drivers
      - xdg-desktop-portal
      # A Secret Service for the keyring: GNOME Keyring or KWallet.
      - gnome-keyring | kwalletmanager
      # Asks for the user's password before stored keys and to unlock the app lock.
      - polkitd | policykit-1
  rpm:
    depends:
      - libxkbcommon
      # winit loads it for an X11 session; without it the window panics at start.
      - libxkbcommon-x11
      - (vulkan-loader or libglvnd-egl)
      - dbus-libs
      - gtk3
      - fontconfig
      - systemd-libs
    recommends:
      - libwayland-client
      - libX11
      - libXcursor
      - libXi
      - libXrandr
      - mesa-vulkan-drivers
      - xdg-desktop-portal
      - polkit

contents:
  - src: ${STAGE}/usr/bin/sshcraft
    dst: /usr/bin/sshcraft
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/bin/sshcraft-cli
    dst: /usr/bin/sshcraft-cli
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/share/
    dst: /usr/share/
    type: tree

scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh
