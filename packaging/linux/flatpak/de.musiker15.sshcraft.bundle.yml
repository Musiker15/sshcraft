# Adapted from storytold/gridcraft (Apache-2.0).
# Flatpak manifest for the single-file bundle attached to every GitHub release
# (sshcraft-<version>-linux-<arch>.flatpak). Build it with packaging/linux/flatpak-bundle.sh.
#
# It repackages the release's own Linux tarball (sshcraft-<version>-linux-<arch>.tar.gz, built
# by package.sh) instead of compiling Rust inside flatpak-builder: no network and no vendored
# crate sources during the build, and the same binaries as the AppImage, deb and rpm. The script
# unpacks the tarball into `stage/` next to a copy of this file.
#
# de.musiker15.sshcraft.yml (same directory) is the from-source manifest for Flathub. Keep runtime,
# runtime-version, sdk and finish-args identical in both (packaging-lint checks this).
id: de.musiker15.sshcraft
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: sshcraft
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # SSH, sync and port forwarding need the network.
  - --share=network
  # GPU access for rendering.
  - --device=dri
  # Keys and passwords live in the desktop's keyring (Secret Service).
  - --talk-name=org.freedesktop.secrets
  # ~/.ssh/config and its keys are read for import and the live link (F1). Written only when
  # the user saves a linked host back (sshconfig.write), with a copy of the old file in
  # ~/.ssh/.sshcraft-backup first.
  - --filesystem=~/.ssh
  # The SSH agent of the session (SSH_AUTH_SOCK) for signing in with its keys and for agent
  # forwarding.
  - --socket=ssh-auth
  # Open/Save dialogs (import, export, logs) use the file-chooser portal (rfd), so broad
  # filesystem access isn't needed. Serial ports and the host's own shell are not reachable from
  # the sandbox; use the deb, rpm, AppImage or tarball for them.
modules:
  - name: sshcraft
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/sshcraft /app/bin/sshcraft
      # Command line and MCP server: `flatpak run --command=sshcraft-cli de.musiker15.sshcraft`.
      - install -Dm755 bin/sshcraft-cli /app/bin/sshcraft-cli
      - install -Dm644 share/applications/de.musiker15.sshcraft.desktop /app/share/applications/de.musiker15.sshcraft.desktop
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/de.musiker15.sshcraft.metainfo.xml /app/share/metainfo/de.musiker15.sshcraft.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/sshcraft /app/share/doc/
    sources:
      - type: dir
        path: stage
