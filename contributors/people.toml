# Contributor names for the About window.
#
# Everyone who contributes is credited by GitHub username automatically. Anything more is up to
# you: add YOUR OWN entry below, in your own pull request (commit it yourself). Never add someone
# else; a maintainer may add a person only when that person asked.
#
# Copy this block, replacing your-github-username (every field is optional):
#
#   [people.your-github-username]
#   real_name = "Your Name"        # shown when the viewer picks "Real name"
#   display_name = "Nickname"      # shown when the viewer picks "Display name"
#   sync_github_name = true        # or: use the name on your public GitHub profile as display name
#
# To remove your names, delete your entry (or set fields empty) in a pull request.

[people.Musiker15]
sync_github_name = true
