[package]
name = "sshcraft-proto"
description = "Sync protocol and end-to-end cryptography for SSHCraft"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ed25519-dalek = { workspace = true }
hpke = { workspace = true }
chacha20poly1305 = { workspace = true }
sha2 = { workspace = true }
hkdf = { workspace = true }
data-encoding = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

# In the browser the system random source is the Web Crypto API (cargo xtask wasm).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
uuid = { workspace = true, features = ["rng-getrandom"] }

[lints]
workspace = true
