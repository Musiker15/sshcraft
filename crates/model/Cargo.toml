[package]
name = "sshcraft-model"
description = "Data model of SSHCraft: hosts, groups, identities, forwarding rules and agent policy"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
hmac = { workspace = true }
sha1 = { workspace = true }

# In the browser the system random source is the Web Crypto API (cargo xtask wasm).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
uuid = { workspace = true, features = ["rng-getrandom"] }

[lints]
workspace = true