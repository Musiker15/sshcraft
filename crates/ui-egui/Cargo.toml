[package]
name = "sshcraft-ui-egui"
description = "The egui interface of SSHCraft"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# testing::app_harness: the app in egui_kittest on an engine for tests.
testing = ["dep:egui_kittest", "sshcraft-engine/testing"]

[dependencies]
sshcraft-term = { workspace = true }
sshcraft-engine = { workspace = true }
sshcraft-platform = { workspace = true }
sshcraft-model = { workspace = true }
sshcraft-import = { workspace = true }
egui = { workspace = true, features = ["default_fonts"] }
egui_system_font_provider = { workspace = true }
craft-ui = { workspace = true }
craft-keymap = { workspace = true }
craft-dialogs = { workspace = true }
raw-window-handle = { workspace = true }
fontique = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bitflags = { workspace = true }
sys-locale = { workspace = true }
uuid = { workspace = true }
data-encoding = { workspace = true }
qrcode = { workspace = true }
zeroize = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
tokio = { workspace = true }
egui_kittest = { workspace = true, optional = true }

[dev-dependencies]
sshcraft-server-lib = { workspace = true }
sshcraft-link = { workspace = true }
memory-stats = { workspace = true }
russh = { workspace = true }
rand = { workspace = true }
sshcraft-ui-egui = { path = ".", features = ["testing"] }
sshcraft-engine = { workspace = true, features = ["testing"] }
sshcraft-ssh = { workspace = true, features = ["testing"] }
eframe = { workspace = true }
tempfile = { workspace = true }
data-encoding = { workspace = true }
uuid = { workspace = true }
egui_kittest = { workspace = true, features = ["wgpu"] }
image = { workspace = true, features = ["png"] }

[lints]
workspace = true
