[package]
name = "sshcraft-sync"
description = "Client side of SSHCraft sync: talks to a sync server and keeps this device in step"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
sshcraft-proto = { workspace = true }
sshcraft-model = { workspace = true }
sshcraft-store = { workspace = true }
reqwest = { workspace = true }
# Mozilla's root certificates for HTTPS on Android (`client::mozilla_roots`).
webpki-root-certs = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
data-encoding = { workspace = true }
zeroize = { workspace = true }
russh = { workspace = true }
qrcode = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
futures = { workspace = true }

[dev-dependencies]
rand = { workspace = true }
sshcraft-server-lib = { workspace = true }
tempfile = { workspace = true }
rusqlite = { workspace = true }
sshcraft-store = { workspace = true, features = ["testing"] }

[lints]
workspace = true
