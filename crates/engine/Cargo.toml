[package]
name = "sshcraft-engine"
description = "The SSHCraft engine: every action is a command behind Session::execute"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# SessionConfig::for_tests and the fakes, for the interface (R4) and the MCP tests (R6).
testing = ["sshcraft-store/testing", "sshcraft-fido/testing", "sshcraft-ssh/testing", "dep:rand"]

[dependencies]
sshcraft-model = { workspace = true }
sshcraft-store = { workspace = true }
sshcraft-platform = { workspace = true }
sshcraft-fido = { workspace = true }
sshcraft-ssh = { workspace = true }
sshcraft-import = { workspace = true }
sshcraft-local = { workspace = true }
sshcraft-sync = { workspace = true }
sshcraft-proto = { workspace = true }
zeroize = { workspace = true }
craft-settings = { workspace = true }
craft-flags = { workspace = true }
craft-ai-agents = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
strum = { workspace = true }
russh = { workspace = true }
wait-timeout = { workspace = true }
sys-locale = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
directories = { workspace = true }
data-encoding = { workspace = true }

[target.'cfg(windows)'.dependencies]
# PuTTY keeps its sessions in the registry.
winreg = { workspace = true }

[dependencies.rand]
workspace = true
optional = true

[dev-dependencies]
sshcraft-server-lib = { workspace = true }
sshcraft-engine = { path = ".", features = ["testing"] }
tempfile = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
