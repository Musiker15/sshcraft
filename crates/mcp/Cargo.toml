[dev-dependencies]
sshcraft-engine = { workspace = true, features = ["testing"] }
sshcraft-ssh = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
uuid = { workspace = true }

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true
