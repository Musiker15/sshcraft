[package]
name = "sshcraft-mcp"
description = "SSHCraft's MCP server: tools for AI agents over stdio, each a thin wrapper around an engine command of the running app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
sshcraft-link = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
