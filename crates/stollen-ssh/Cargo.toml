[package]
name = "stollen-ssh"
description = "SSH session engine for Stollen"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# In-process SSH test server, used by this crate's tests and by the app's tests.
testing = ["dep:rand", "dep:futures"]

[dependencies]
stollen-core = { workspace = true }
russh = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
rand = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[dev-dependencies]
stollen-ssh = { path = ".", features = ["testing"] }
rand = { workspace = true }
russh = { workspace = true }
stollen-core = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
