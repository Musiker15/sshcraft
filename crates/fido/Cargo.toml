[package]
name = "sshcraft-fido"
description = "FIDO2 security keys and Windows Hello for SSHCraft: OpenSSH sk- keys over WebAuthn"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# A software authenticator that signs like a token, for tests.
testing = ["dep:ed25519-dalek"]

[dependencies]
sshcraft-ssh = { workspace = true }
russh = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
ciborium = "0.2.2"
p256 = "0.14.0"
ed25519-dalek = { workspace = true, optional = true }
rand = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Networking_WindowsWebServices", "Security_Credentials_UI", "Foundation", "Win32_System_WinRT"] }
# The async types of the windows crate: the 0.3 line that windows 0.62 itself uses, so the types match.
windows-future = "0.100.0"

[dev-dependencies]
sshcraft-fido = { path = ".", features = ["testing"] }
sshcraft-ssh = { workspace = true, features = ["testing"] }
rand = { workspace = true }

# The one crate that may use unsafe: WebAuthn and Windows Hello are only reachable through the
# Windows API (webauthn.dll). The workspace forbids unsafe, so this crate states its own lints:
# unsafe is denied crate-wide and allowed only in the platform modules that start with
# #![allow(unsafe_code)], each block with a SAFETY comment. The clippy entries match the workspace.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
