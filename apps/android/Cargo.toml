[package]
name = "sshcraft-android"
description = "SSHCraft on Android: the egui interface in a NativeActivity"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# libsshcraft_android.so for the APK; the rlib lets the helpers below be tested on the desktop.
# Not `sshcraft`: on Windows a cdylib of that name would share sshcraft.pdb with the desktop app.
[lib]
name = "sshcraft_android"
crate-type = ["cdylib", "rlib"]

[features]
# OpenGL ES instead of Vulkan: the emulator's Vulkan driver (gfxstream) crashes under wgpu.
# `cargo xtask android --emulator` sets it; the APK for tablets never does.
gl = []

[dependencies]
craft-settings = { workspace = true }
egui = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
sshcraft-engine = { workspace = true }
sshcraft-fido = { workspace = true }
sshcraft-ui-egui = { workspace = true }
# Not the workspace's eframe: its accesskit feature needs GameActivity (eframe refuses it with
# NativeActivity). Screen readers go through accesskit_android directly (src/a11y.rs).
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "android-native-activity"] }
# The version eframe uses (the storytold fork through [patch]); its AndroidApp type must match.
winit = { version = "0.30.13", default-features = false, features = ["android-native-activity"] }
tokio = { workspace = true }
async-trait = { workspace = true }
android_clipboard = "0.1.0"
# Screen readers: AccessKit's adapter on NativeActivity's view (src/a11y.rs). The dex with its
# Java delegate comes with the crate, so `cargo xtask android` builds no Java of it.
accesskit_android = { version = "0.9.1", features = ["embedded-dex"] }
# The keyboard's text connection (src/keyboard.rs) and the biometric prompt (src/biometric.rs):
# the VM and the activity from android-activity.
jni = "0.22.4"
ndk-context = "0.1.1"
# Rust's log to logcat: without it a failure on Android leaves no trace.
android_logger = "0.15.1"
log = "0.4.35"

# android-activity calls the exported `android_main`, and exporting a symbol counts as unsafe
# code; the keyboard's text connection and the biometric prompt need the raw JavaVM and activity.
# The workspace forbids unsafe, so this crate states its own lints like `crates/fido`: denied
# crate-wide and allowed on `android_main` and in `src/keyboard.rs`, `src/biometric.rs` and
# `src/a11y.rs` only.
# The clippy entries match the workspace.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
