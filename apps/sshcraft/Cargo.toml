[package]
name = "sshcraft"
description = "SSHCraft, the desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "sshcraft"
path = "src/main.rs"

[dependencies]
sshcraft-engine = { workspace = true }
sshcraft-fido = { workspace = true }
sshcraft-platform = { workspace = true }
sshcraft-model = { workspace = true }
uuid = { workspace = true }
global-hotkey = "0.10.0"
sshcraft-ui-egui = { workspace = true }
sshcraft-link = { workspace = true }
craft-window = { workspace = true }
craft-quit = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
raw-window-handle = { workspace = true }

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
serde_json = { workspace = true }
sshcraft-engine = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }

[lints]
workspace = true
