[package]
name = "sshcraft-cli"
description = "The command line and MCP server for AI agents: talks to the running SSHCraft app, never opens its data"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "sshcraft-cli"
path = "src/main.rs"

[dependencies]
sshcraft-link = { workspace = true }
sshcraft-mcp = { workspace = true }
sshcraft-platform = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
data-encoding = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
sshcraft-engine = { workspace = true, features = ["testing"] }
sshcraft-ssh = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }

[lints]
workspace = true
