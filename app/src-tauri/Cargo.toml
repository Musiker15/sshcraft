[package]
name = "stollen-app"
description = "Stollen desktop and mobile client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
name = "stollen_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
stollen-core = { workspace = true }
stollen-ssh = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
directories = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
stollen-ssh = { workspace = true, features = ["testing"] }
russh = { workspace = true }
rand = { workspace = true }
