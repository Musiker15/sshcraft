[package]
name = "sshcraft-app"
description = "SSHCraft desktop and mobile client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
name = "sshcraft_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
sshcraft-core = { workspace = true }
sshcraft-ssh = { workspace = true }
sshcraft-proto = { workspace = true }
sshcraft-sync = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
directories = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
strum = { version = "0.28.0", features = ["derive"] }
wait-timeout = "0.2.1"
sys-locale = "0.3.2"

russh = { workspace = true }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux", target_os = "freebsd"))'.dependencies]
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-dialog = "2.8.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
windows = { version = "0.62.2", features = ["Security_Credentials_UI", "Foundation", "Win32_Foundation", "Win32_System_WinRT"] }
windows-future = "0.3.2"

[dev-dependencies]
tempfile = { workspace = true }
sshcraft-ssh = { workspace = true, features = ["testing"] }
rand = { workspace = true }
